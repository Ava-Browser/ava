name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # macos-14's default toolchain is Swift 5.10, which cannot read the package's Swift tools
    # version 6.0. macos-15 ships Swift 6, so pin the image rather than the toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # `fetch-depth` above applies to this repo only, not the submodule, and the R7 guard needs the
      # fork's upstream history to find the fork point. Deepen it here.
      - name: Submodule history for the R7 guard
        run: |
          git -C Extern/ladybird fetch --unshallow origin 2>/dev/null || true
          git -C Extern/ladybird remote add upstream https://github.com/LadybirdBrowser/ladybird.git 2>/dev/null || true
          git -C Extern/ladybird fetch upstream master

      - name: Toolchain
        run: swift --version

      - name: Contract rules and layer boundaries
        run: /bin/bash ./Scripts/check-layers.sh

      # Compile targets without linking: linking and running tests require the real engine.
      # An empty dylib cannot satisfy the C symbols now used by LadybirdBridge.
      - name: Compile application
        run: swift build --target Ava

      - name: Compile tests
        run: |
          swift build --target LadybirdBridgeTests
          swift build --target LadybirdIntegrationTests

      # Packaging is the one script a push can break without any Swift file changing, and it broke
      # twice already: an uncommented comment line in build.sh, and signing the bundle after the
      # executable, which silently re-signed away the entitlements the engine needs to load its shim.
      # This runs the real package.sh against a synthetic engine tree, so it needs no engine build.
      - name: Package assembly
        run: /bin/bash ./Scripts/test-package.sh

  # The assembly test above proves package.sh does not lie about what it shipped, but it cannot prove
  # the real engine runs from the image — that needs the real helpers, the real dylib closure and the
  # real Resources. This job builds those on a runner that already has an engine tree, and is skipped
  # (not failed) elsewhere: faking it would report green for a bundle nobody built.
  package:
    needs: checks
    if: vars.AVA_ENGINE_BUILD_DIR != ''
    runs-on: ${{ vars.AVA_ENGINE_RUNNER || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Point the package at the prebuilt engine
        env:
          ENGINE_BUILD_DIR: ${{ vars.AVA_ENGINE_BUILD_DIR }}
        # The fork gitignores Build*/, so a fresh checkout has no Extern/ladybird/Build to link inside.
        run: |
          mkdir -p Extern/ladybird/Build
          ln -sfn "${ENGINE_BUILD_DIR}" Extern/ladybird/Build/release

      # --no-build skips the engine/shim build only; the Swift app still has to be compiled, and it
      # links against the prebuilt shim above.
      - name: Build the release app
        run: swift build -c release

      # Ad hoc signing only: notarization needs a Developer ID, which a pull request from a fork must
      # never have access to.
      - name: Package the app and DMG
        # CFBundleVersion must be period-separated integers; a "-<sha>" suffix is not a valid bundle
        # version. The SHA identifies the artifact instead.
        run: ./Scripts/package.sh --no-build --version "0.1.0"

      - name: Keep the commit in the artifact name
        run: |
          mv "$(ls ./.build/package/Ava-*.dmg)" "./.build/package/Ava-0.1.0-${GITHUB_SHA::7}.dmg"

      # The DMG is the artifact a user gets, so the check that matters is that it mounts and the app
      # inside it starts — not that the app path in the workspace starts.
      - name: Launch from the mounted DMG
        run: |
          set -uo pipefail
          DMG="$(ls ./.build/package/Ava-*.dmg)"
          MOUNT="$(mktemp -d)"
          # One cleanup for every exit path: a failed startup check must not leave the app running or
          # the image mounted on a self-hosted runner (AVA_ENGINE_RUNNER can point at one).
          cleanup() {
            pkill -f "${MOUNT}/Ava.app" 2>/dev/null || true
            hdiutil detach -quiet "${MOUNT}" 2>/dev/null || true
            rm -rf "${MOUNT}"
          }
          trap cleanup EXIT
          hdiutil attach -quiet -nobrowse -mountpoint "${MOUNT}" "${DMG}"

          codesign --verify --strict "${MOUNT}/Ava.app"

          # A GUI app cannot take focus in CI, so assert on what the engine does: the bundle loads
          # (no dyld failure) and the helper processes come up from inside the image.
          "${MOUNT}/Ava.app/Contents/MacOS/Ava" & APP_PID=$!
          for _ in $(seq 1 30); do
            pgrep -f "${MOUNT}/Ava.app/Contents/MacOS/WebContent" > /dev/null && break
            kill -0 "${APP_PID}" 2>/dev/null || { echo "app exited during startup"; exit 1; }
            sleep 1
          done
          if ! pgrep -f "${MOUNT}/Ava.app/Contents/MacOS/WebContent" > /dev/null; then
            echo "WebContent never started from the bundle"
            exit 1
          fi
          echo "helpers running from the mounted image"

      - uses: actions/upload-artifact@v4
        with:
          name: Ava-dmg
          path: .build/package/Ava-*.dmg
          retention-days: 14

      # CI checks source compilation, boundaries and packaging. Run swift test locally after building
      # the engine; native probes also need an interactive desktop.
