name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # macos-14's default toolchain is Swift 5.10, which cannot read the package's Swift tools
    # version 6.0. macos-15 ships Swift 6, so pin the image rather than the toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # `fetch-depth` above applies to this repo only, not the submodule, and the R7 guard needs the
      # fork's upstream history to find the fork point. Deepen it here.
      - name: Submodule history for the R7 guard
        run: |
          git -C Extern/ladybird fetch --unshallow origin 2>/dev/null || true
          git -C Extern/ladybird remote add upstream https://github.com/LadybirdBrowser/ladybird.git 2>/dev/null || true
          git -C Extern/ladybird fetch upstream master

      - name: Toolchain
        run: swift --version

      - name: Contract rules and layer boundaries
        run: /bin/bash ./Scripts/check-layers.sh

      # Compile targets without linking: linking and running tests require the real engine.
      # An empty dylib cannot satisfy the C symbols now used by LadybirdBridge.
      - name: Compile application
        run: swift build --target Ava

      - name: Compile tests
        run: |
          swift build --target LadybirdBridgeTests
          swift build --target LadybirdIntegrationTests

      # CI checks source compilation and boundaries, not runtime behavior. Run swift test
      # locally after building the engine; native probes also need an interactive desktop.
