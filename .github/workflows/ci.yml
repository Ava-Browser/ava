name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # macos-14's default toolchain is Swift 5.10, which cannot read the package's Swift tools
    # version 6.0. macos-15 ships Swift 6, so pin the image rather than the toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # `fetch-depth` above applies to this repo only, not the submodule, and the R7 guard needs the
      # fork's upstream history to find the fork point. Deepen it here.
      - name: Submodule history for the R7 guard
        run: |
          git -C Extern/ladybird fetch --unshallow origin 2>/dev/null || true
          git -C Extern/ladybird remote add upstream https://github.com/LadybirdBrowser/ladybird.git 2>/dev/null || true
          git -C Extern/ladybird fetch upstream master

      - name: Toolchain
        run: swift --version

      - name: Contract rules and layer boundaries
        run: ./Scripts/check-layers.sh

      # The real shim needs the fork's CMake build (hours, plus vcpkg). CI only needs to know that
      # every Swift target compiles and the test bundle links, so link against an empty stub: none
      # of the Swift code references a C symbol yet, only C types. When LadybirdEngine starts
      # calling into the engine this must become a real build; see Documentation/Architecture.md.
      - name: Stub shim (Swift targets do not call into it yet)
        run: |
          mkdir -p Extern/ladybird/Build/release/lib
          printf '/* CI stub: no symbols. See .github/workflows/ci.yml. */\n' > "${RUNNER_TEMP}/stub.c"
          clang -dynamiclib -o Extern/ladybird/Build/release/lib/liblagom-port.dylib "${RUNNER_TEMP}/stub.c"

      - name: Build tests
        run: swift build --build-tests

      - name: Engine-free tests
        run: swift test --filter LadybirdBridgeTests

      # Deliberately NOT run here: the fork's CMake build and the window-opening probes.
      # See Documentation/Architecture.md, "Known gaps".
